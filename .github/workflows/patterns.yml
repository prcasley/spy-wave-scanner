name: PatternScope

on:
  schedule:
    # 21:37 UTC = 5:37pm ET (EDT), once per weekday after the close. No intraday runs.
    - cron: '37 21 * * 1-5'
  push:
    branches: [main]
    paths: ['patternscope/**', '.github/workflows/patterns.yml']
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: dashboard          # shares the Pages deploy queue with dashboard.yml
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r patternscope/requirements.txt
      - name: Scan watchlist (Yahoo Finance)
        working-directory: patternscope
        run: python scan.py --out output
      - name: Commit report
        run: |
          git config user.name  "patternscope bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4; do
            git fetch -q origin main && git reset -q --hard origin/main
            mkdir -p docs/patterns
            cp patternscope/output/cockpit.html docs/patterns/index.html
            cp patternscope/output/report.html docs/patterns/classic.html
            cp patternscope/output/guide.html docs/patterns/guide.html
            cp patternscope/output/latest.json docs/patterns/latest.json
            cp patternscope/output/pattern_stats.csv docs/patterns/
            [ -f patternscope/output/live_signals.csv ] && cp patternscope/output/live_signals.csv docs/patterns/ || true
            git add docs/patterns
            git diff --staged --quiet && break
            git commit -q -m "patterns: $(date -u +%Y-%m-%d\ %H:%M)"
            git push -q origin HEAD:main && break
            sleep $((i * 15))
          done
      - name: Upload Excel to the 'patternscope-latest' release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view patternscope-latest >/dev/null 2>&1 || gh release create patternscope-latest \
            --title "PatternScope — latest data" --notes "Auto-updated workbook. Download PatternScope.xlsx." --latest=false
          gh release upload patternscope-latest patternscope/output/PatternScope.xlsx --clobber
      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
