name: SPY Wave Scanner

on:
  schedule:
    # Run every 5 minutes during US market hours (9:30 AM - 4:00 PM ET = 14:30 - 21:00 UTC)
    - cron: '*/5 14-21 * * 1-5'
  push:
    branches: [main, master]
  workflow_dispatch:  # Manual trigger

permissions:
  contents: write  # Needed to commit JSON data back for GitHub Pages

jobs:
  scan:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run wave scanner
        run: python scripts/run_scanner.py --dry-run --output-json docs/data/latest_scan.json
        env:
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}

      - name: Commit scan results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/
          git diff --staged --quiet || git commit -m "Update scan results [skip ci]"
          git push

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        run: pytest tests/ -v

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Lint
        run: |
          pip install ruff
          ruff check src/ scripts/ tests/

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install mypy

      - name: Type check
        run: mypy src/ --ignore-missing-imports
