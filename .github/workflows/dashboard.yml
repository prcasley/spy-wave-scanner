name: Positioning dashboard

on:
  schedule:
    # UTC. 13:29 = 9:29am ET and 19:59 = 3:59pm ET during EDT.
    # When EST starts in November, shift both +1h (14:29 / 20:59).
    - cron: '29 13 * * 1-5'
    - cron: '59 19 * * 1-5'
  workflow_dispatch:
    inputs:
      slot:
        description: 'preopen or close'
        required: false
        default: 'close'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: dashboard
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Pick slot from schedule
        id: slot
        run: |
          # Match on the MINUTE (29 = morning, 59 = afternoon), not the whole
          # cron string. The hour shifts with daylight saving; the minute does
          # not. Comparing the full string meant the documented November edit
          # silently relabelled the 9:29am run as "close".
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "slot=${{ inputs.slot }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ startsWith(github.event.schedule, '29 ') }}" = "true" ]; then
            echo "slot=preopen" >> "$GITHUB_OUTPUT"
          else
            echo "slot=close" >> "$GITHUB_OUTPUT"
          fi

      - name: Test the generator
        # Standard library only, so this needs no install. Pins the chart and
        # email invariants documented in dashboard/README.md — see the design
        # notes there before changing any of them.
        run: python dashboard/test_generate.py

      - name: Generate dashboard
        env:
          TWELVEDATA_KEY:   ${{ secrets.TWELVEDATA_KEY }}
          ALPHAVANTAGE_KEY: ${{ secrets.ALPHAVANTAGE_KEY }}
          SMTP_USER:        ${{ secrets.SMTP_USER }}
          SMTP_PASS:        ${{ secrets.SMTP_PASS }}
          MAIL_TO:          ${{ secrets.MAIL_TO }}
          TICKERS:          ${{ vars.TICKERS }}
          PAGES_URL:        ${{ vars.PAGES_URL }}
          SLOT:             ${{ steps.slot.outputs.slot }}
        run: python dashboard/generate.py

      - name: Commit the regenerated dashboard
        run: |
          git config user.name  "dashboard bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --staged --quiet; then
            echo "no change"
          else
            git commit -m "dashboard: ${{ steps.slot.outputs.slot }} $(date -u +%Y-%m-%d\ %H:%M)"
            git push
          fi

      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
