[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "patternscope"
version = "0.3.0"
description = "Chart/candle/indicator pattern detection, backtesting and grading"
requires-python = ">=3.10"
dependencies = ["pandas>=2.0", "numpy>=1.24"]

[project.optional-dependencies]
data = ["yfinance>=0.2.40", "ccxt>=4.3"]
excel = ["xlsxwriter>=3.1"]

[tool.setuptools]
packages = ["patternscope"]
